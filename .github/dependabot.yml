version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      non-breaking:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      non-breaking:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    groups:
      non-breaking:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      non-breaking:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    groups:
      non-breaking:
        update-types:
          - "minor"
          - "patch"
